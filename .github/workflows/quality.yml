name: Quality

on:
  push:
    branches: [main, claude/neverdiefable-consolidation-pmjspv]
  pull_request:

permissions:
  contents: read

jobs:
  api-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: services/api/requirements.lock
      - run: python -m pip install --requirement services/api/requirements.lock
      - run: python -m pip check
      - run: python -m pytest services/api/tests -q
      - run: python -m compileall -q services/api/app services/api/tests services/ai
